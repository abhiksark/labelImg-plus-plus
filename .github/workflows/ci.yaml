name: CI

on:
  push:
    branches: [master, main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main, dev]
    types: [opened, synchronize, reopened, labeled]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements/requirements-linux-python3.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1-mesa-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest wheel


      - name: Verify base startup stays optional-feature-free
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; import labelImgPlusPlus; assert 'av' not in sys.modules; assert 'cv2' not in sys.modules; assert 'numpy' not in sys.modules"
          python -c "from libs.core.video_decoder import VIDEO_INSTALL_HINT; assert 'labelimgplusplus[video]' in VIDEO_INSTALL_HINT"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

  plugin-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1-mesa-dev

      - name: Install plugin test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest wheel

      - name: Run plugin compatibility, packaging, and performance gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest \
            tests/core/test_plugin_discovery.py \
            tests/core/test_plugin_manager.py \
            tests/core/test_shortcut_config.py \
            tests/integration/test_plugins.py \
            tests/integration/test_plugin_packaging.py \
            tests/integration/test_plugin_performance.py \
            -v

  sam-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1-mesa-dev

      - name: Install package with SAM dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[sam]' pytest


      - name: Run focused SAM tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest \
            tests/integrations \
            tests/integration/test_sam_controller.py \
            tests/integration/test_sam_mainwindow.py \
            tests/widgets/test_canvas_sam.py \
            tests/widgets/test_sam_settings_dialog.py \
            tests/utils/test_sam_constants.py \
            -v

  video-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1-mesa-dev

      - name: Install package with video dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[video]' pytest


      - name: Run focused video tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/video -v

  sam-video-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1-mesa-dev

      - name: Install combined optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[sam,video]' pytest


      - name: Run combined feature tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest \
            tests/video \
            tests/integrations \
            tests/integration/test_sam_controller.py \
            tests/integration/test_sam_mainwindow.py \
            tests/widgets/test_canvas_sam.py \
            tests/widgets/test_sam_settings_dialog.py \
            tests/utils/test_sam_constants.py \
            -v

  video-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package with video dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[video]' pytest

      - name: Run decoder and persistence smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/video/test_decoder.py tests/video/test_project.py tests/video/test_model.py tests/video/test_tracking.py tests/video/test_export.py tests/video/test_opening.py tests/video/test_navigation.py tests/video/test_timeline.py -v

  build-release:
    needs: [test, plugin-test, sam-test, video-test, sam-video-test, video-platform-smoke]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate release tag and branch ancestry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if match is None:
              raise SystemExit('package version not found')
          print(match.group(1))
          PY
          )
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          git fetch --no-tags origin master
          tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          git merge-base --is-ancestor "${tag_commit}" origin/master
      - name: Validate release candidate source
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          test "${actual_sha}" = "${EXPECTED_SHA}"
          package_version=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if match is None:
              raise SystemExit('package version not found')
          version = match.group(1)
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:a|b|rc)[0-9]+',
                          version) is None:
              raise SystemExit(
                  f'release-candidate label requires a prerelease: {version}')
          print(version)
          PY
          )
          printf 'Release candidate %s at %s\n' \
            "${package_version}" "${actual_sha}"


      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and check original distributions
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Inspect distribution members
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required = (
              "libs/assets/icons/app.icns",
              "libs/assets/strings/strings.properties",
              "libs/assets/licenses/feather.txt",
              "libs/data/predefined_classes.txt",
          )
          blocked = (
              "resources.qrc",
              "libs/resources.py",
              "scripts/build_qt_resources.py",
              "scripts/verify_qt_resources.py",
          )
          for artifact in Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
              else:
                  continue
              assert all(any(name.endswith(item) for name in names)
                         for item in required), artifact
              assert not any(
                  name.endswith(".qrc")
                  or any(name.endswith(item) for item in blocked)
                  for name in names
              ), artifact
          PY

      - name: Rebuild wheel from sdist
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-wheel"
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz

      - name: Verify direct and sdist-derived wheels outside checkout
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for wheel in dist/*.whl "$RUNNER_TEMP"/sdist-wheel/*.whl; do
            index=$((index + 1))
            envdir="$RUNNER_TEMP/distribution-env-$index"
            workdir="$RUNNER_TEMP/distribution-work-$index"
            python -m venv "$envdir"
            "$envdir/bin/python" -m pip install --upgrade pip
            "$envdir/bin/python" -m pip install "$wheel"
            mkdir -p "$workdir"
            (
              cd "$workdir"
              "$envdir/bin/labelimgpp" --verify-assets
              "$envdir/bin/labelimgplusplus" --verify-assets
              "$envdir/bin/labelImgPlusPlus" --verify-assets
              QT_QPA_PLATFORM=offscreen \
                "$envdir/bin/python" -c \
                "import sys, labelImgPlusPlus; assert 'PyQt6' in sys.modules; assert not {'PyQt4', 'PyQt5', 'av', 'cv2', 'numpy', 'onnxruntime', 'torch', 'torchvision', 'sam2'} & sys.modules.keys()"
            )
            python scripts/smoke_frozen_app.py \
              "$envdir/bin/labelimgpp" --seconds 5
          done

      - name: Upload tested original distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  package-macos:
    needs: [test, plugin-test, sam-test, video-test, sam-video-test, video-platform-smoke]
    runs-on: macos-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    env:
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Package
        run: python -m PyInstaller --clean --noconfirm build-tools/labelImgPlusPlus.spec
      - name: Verify artifact outside checkout
        env:
          QT_QPA_PLATFORM: offscreen
          LABELIMGPP_DISABLE_PLUGINS: '1'
        run: |
          artifact="$RUNNER_TEMP/labelImgPlusPlus"
          cp dist/labelImgPlusPlus "$artifact"
          chmod +x "$artifact"
          "$artifact" --verify-assets
          python scripts/smoke_frozen_app.py "$artifact" --seconds 5
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-artifact
          path: ${{ runner.temp }}/labelImgPlusPlus
          if-no-files-found: error

  package-windows:
    needs: [test, plugin-test, sam-test, video-test, sam-video-test, video-platform-smoke]
    runs-on: windows-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    env:
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Package
        run: python -m PyInstaller --clean --noconfirm build-tools/labelImgPlusPlus.spec
      - name: Verify artifact outside checkout
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          LABELIMGPP_DISABLE_PLUGINS: '1'
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "labelImgPlusPlus.exe"
          Copy-Item "dist/labelImgPlusPlus.exe" $artifact
          & $artifact --verify-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_frozen_app.py $artifact --seconds 5
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-artifact
          path: ${{ runner.temp }}/labelImgPlusPlus.exe
          if-no-files-found: error

  package-linux:
    needs: [test, plugin-test, sam-test, video-test, sam-video-test, video-platform-smoke]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    env:
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
                github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Package
        run: python -m PyInstaller --clean --noconfirm build-tools/labelImgPlusPlus.spec
      - name: Verify artifact outside checkout
        env:
          QT_QPA_PLATFORM: offscreen
          LABELIMGPP_DISABLE_PLUGINS: '1'
        run: |
          artifact="$RUNNER_TEMP/labelImgPlusPlus"
          cp dist/labelImgPlusPlus "$artifact"
          chmod +x "$artifact"
          "$artifact" --verify-assets
          python scripts/smoke_frozen_app.py "$artifact" --seconds 5
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-artifact
          path: ${{ runner.temp }}/labelImgPlusPlus
          if-no-files-found: error

  publish:
    needs: [build-release, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/labelimgplusplus/

    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish exact tested distributions
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: dist/
