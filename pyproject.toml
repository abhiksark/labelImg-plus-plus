[build-system]
requires = ["setuptools>=61.0,<69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelimgplusplus"
version = "4.0.0rc0"
description = "labelImg++ is an enhanced graphical image annotation tool with Gallery Mode for browsing and labeling images"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    {name = "Abhik Sarkar", email = "abhiksark@gmail.com"}
]
requires-python = ">=3.8"
keywords = ["labelImg", "labelimgpp", "labelimgplusplus", "annotation", "deeplearning", "image-annotation", "bounding-box", "gallery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pyqt5",
    "lxml",
]

[project.optional-dependencies]
sam = [
    "onnxruntime",
    "numpy",
    "opencv-python-headless>=4.8,<6",
]
video = [
    "av>=12.3,<13; python_version == '3.8'",
    "av>=15.1,<16; python_version == '3.9'",
    "av>=17.1,<18; python_version == '3.10'",
    "av>=18,<19; python_version >= '3.11'",
    "numpy",
    "opencv-python-headless>=4.8,<6",
]
profile = [
    "psutil",
    "py-spy",
    "pytest-benchmark",
]

[project.urls]
Homepage = "https://github.com/abhiksark/labelImg-plus-plus"
Repository = "https://github.com/abhiksark/labelImg-plus-plus"

[project.scripts]
labelimgpp = "labelImgPlusPlus:main"
labelimgplusplus = "labelImgPlusPlus:main"
labelImgPlusPlus = "labelImgPlusPlus:main_deprecated"

[tool.setuptools]
py-modules = ["labelImgPlusPlus"]

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "labelimgplusplus*"]

[tool.setuptools.package-data]
"*" = ["data/*.txt", "resources/**/*"]
